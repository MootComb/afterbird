name: Chromium Android Full Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Ninja target to build
        required: true
        default: chrome_public_apk
      out_dir:
        description: GN output directory relative to src
        required: true
        default: out/afterbird_production

concurrency:
  group: chromium-full-build
  cancel-in-progress: false

jobs:
  full_build:
    name: Full build (manual)
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h

      - name: Add swap
        run: |
          set -euo pipefail

          if swapon --show | grep -q '/swapfile'; then
            echo "Swap already active:"
            swapon --show
            free -h
            exit 0
          fi

          if [ -e /swapfile ]; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile
          fi

          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          swapon --show
          free -h

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            curl \
            ca-certificates \
            xz-utils \
            unzip \
            zip \
            pkg-config \
            libglib2.0-dev \
            libnss3-dev \
            default-jdk-headless

      - name: Install depot_tools
        run: |
          set -euo pipefail

          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          export PATH="$HOME/depot_tools:$PATH"

          cd "$HOME/depot_tools"

          echo "=== depot_tools bootstrap-related files ==="
          ls -la | grep -Ei 'bootstrap|cipd|vpython|\.py$' || true

          echo "=== gclient --version (triggers bootstrap) ==="
          gclient --version

          echo "=== python3_bin_reldir.txt ==="
          ls -l "$HOME/depot_tools/python3_bin_reldir.txt"
          cat "$HOME/depot_tools/python3_bin_reldir.txt"

          echo "=== which python3 ==="
          which python3
          python3 --version

          echo "=== which gn ==="
          which gn
          gn --version

          echo "=== which gclient ==="
          which gclient
          gclient --version

          echo "=== which autoninja ==="
          which autoninja || true
          autoninja --version || true

      - name: Verify depot_tools in PATH
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"
          echo "PATH=$PATH"
          echo "which gn: $(which gn)"
          echo "which gclient: $(which gclient)"
          echo "which autoninja: $(which autoninja)"
          gn --version
          gclient --version

      - name: Run Chromium full build pipeline
        env:
          DEPOT_TOOLS_UPDATE: '0'
          GCLIENT_KILL_AFTER: '1800'
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"

          echo "[workflow] which gn: $(which gn)"
          echo "[workflow] which gclient: $(which gclient)"
          echo "[workflow] which autoninja: $(which autoninja)"

          ci/chromium_android_pipeline.sh \
            --workdir "$RUNNER_TEMP/afterbird-chromium" \
            --out-dir "${{ github.event.inputs.out_dir }}" \
            --target "${{ github.event.inputs.target }}" \
            --full-build
