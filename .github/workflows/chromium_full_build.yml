name: Chromium Android Full Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Ninja target to build
        required: true
        default: chrome_public_apk
      out_dir:
        description: GN output directory relative to src
        required: true
        default: out/afterbird_production

concurrency:
  group: chromium-full-build
  cancel-in-progress: false

jobs:
  full_build:
    name: Full build (manual)
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h

      - name: Add swap
        run: |
          set -euo pipefail

          if swapon --show | grep -q '/swapfile'; then
            echo "Swap already active:"
            swapon --show
            free -h
            exit 0
          fi

          if [ -e /swapfile ]; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile
          fi

          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          swapon --show
          free -h

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            curl \
            ca-certificates \
            xz-utils \
            unzip \
            zip \
            pkg-config \
            libglib2.0-dev \
            libnss3-dev \
            default-jdk-headless

      - name: Install depot_tools
        run: |
          set -euo pipefail

          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          export PATH="$HOME/depot_tools:$PATH"

          cd "$HOME/depot_tools"
          chmod +x ./cipd ./ensure_bootstrap ./cipd_bin_setup.sh

          echo "=== cipd version ==="
          ./cipd version

          echo "=== search CIPD packages (diagnostic) ==="
          ./cipd search gn 2>&1 | head -n 40 || true
          echo "---"
          ./cipd search ninja 2>&1 | head -n 40 || true
          echo "---"
          ./cipd search luci-auth 2>&1 | head -n 40 || true
          echo "---"
          ./cipd search vpython 2>&1 | head -n 40 || true

          echo "=== write cipd ensure file ==="
          cat > /tmp/cipd_ensure.txt <<'CIPD_EOF'
          luci-auth@latest
          vpython3@latest
          gn/gn/linux-amd64@latest
          infra/ninja/linux-amd64@latest
          CIPD_EOF
          cat /tmp/cipd_ensure.txt

          echo "=== cipd ensure ==="
          ./cipd ensure -root "$HOME/depot_tools" -ensure-file /tmp/cipd_ensure.txt

          echo "=== ensure_bootstrap ==="
          ./ensure_bootstrap

          echo "=== ls .cipd_bin ==="
          ls -la "$HOME/depot_tools/.cipd_bin" || true

          echo "=== python3_bin_reldir.txt ==="
          ls -l "$HOME/depot_tools/python3_bin_reldir.txt" || true
          cat "$HOME/depot_tools/python3_bin_reldir.txt" || true

          echo "=== which python3 ==="
          which python3 || true
          python3 --version || true

          echo "=== which -a gn ==="
          which -a gn || true
          echo "=== gn --version ==="
          gn --version || true

          echo "=== which -a gclient ==="
          which -a gclient || true
          echo "=== gclient --version ==="
          gclient --version || true

          echo "=== which -a autoninja ==="
          which -a autoninja || true
          autoninja --version || true

          echo "=== find gn binary ==="
          find "$HOME/depot_tools" -maxdepth 4 -name 'gn' \( -type f -o -type l \) 2>/dev/null || true

          echo "=== find ninja binary ==="
          find "$HOME/depot_tools" -maxdepth 4 -name 'ninja' \( -type f -o -type l \) 2>/dev/null || true

      - name: Verify depot_tools in PATH
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"
          echo "PATH=$PATH"
          echo "--- which -a gn ---"
          which -a gn || true
          echo "--- which -a gclient ---"
          which -a gclient || true
          echo "--- which -a autoninja ---"
          which -a autoninja || true
          echo "--- gn --version ---"
          gn --version || true
          echo "--- gclient --version ---"
          gclient --version || true

      - name: Run Chromium full build pipeline
        env:
          DEPOT_TOOLS_UPDATE: '0'
          GCLIENT_KILL_AFTER: '1800'
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"

          echo "[workflow] which gn: $(which gn || echo MISSING)"
          echo "[workflow] which gclient: $(which gclient || echo MISSING)"
          echo "[workflow] which autoninja: $(which autoninja || echo MISSING)"

          ci/chromium_android_pipeline.sh \
            --workdir "$RUNNER_TEMP/afterbird-chromium" \
            --out-dir "${{ github.event.inputs.out_dir }}" \
            --target "${{ github.event.inputs.target }}" \
            --full-build
