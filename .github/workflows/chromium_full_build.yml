name: Chromium Android Full Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Ninja target to build
        required: true
        default: chrome_public_apk
      out_dir:
        description: GN output directory relative to src
        required: true
        default: out/afterbird_production
      args_variant:
        description: GN args variant (test or release)
        type: choice
        options: [release, test]
        default: release
      enable_ccache:
        description: Enable ccache
        type: boolean
        default: true
      shallow_sync:
        description: Use --shallow during gclient sync (big speedup, breaks git history)
        type: boolean
        default: true
      ninja_jobs:
        description: Ninja parallelism (-j). Empty = auto
        type: string
        default: "4"

concurrency:
  group: chromium-full-build
  cancel-in-progress: false

jobs:
  full_build:
    name: Full build (manual)
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h

      - name: Add swap
        run: |
          set -euo pipefail
          if swapon --show | grep -q '/swapfile'; then
            swapon --show; free -h; exit 0
          fi
          if [ -e /swapfile ]; then
            sudo swapoff /swapfile || true
            sudo rm -f /swapfile
          fi
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          free -h

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-venv rsync curl \
            ca-certificates xz-utils unzip zip pkg-config \
            libglib2.0-dev libnss3-dev default-jdk-headless \
            ccache

      - name: ccache setup
        if: ${{ github.event.inputs.enable_ccache == 'true' }}
        run: |
          set -euo pipefail
          ccache --version
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/afterbird-chromium/src"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,pch_defines"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        if: ${{ github.event.inputs.enable_ccache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.event.inputs.target }}-${{ github.event.inputs.args_variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.target }}-${{ github.event.inputs.args_variant }}-
            ccache-${{ runner.os }}-${{ github.event.inputs.target }}-
            ccache-${{ runner.os }}-

      - name: Install depot_tools
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/depot_tools/.git" ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          export PATH="$HOME/depot_tools:$PATH"
          cd "$HOME/depot_tools"
          chmod +x ./cipd ./ensure_bootstrap ./cipd_bin_setup.sh
          ./cipd version
          cat > /tmp/cipd_ensure.txt <<'CIPD_EOF'
          gn/gn/linux-amd64 latest
          infra/ninja/linux-amd64 latest
          infra/tools/luci-auth/linux-amd64 latest
          infra/tools/vpython3/linux-amd64 latest
          CIPD_EOF
          ./cipd ensure -root "$HOME/depot_tools" -ensure-file /tmp/cipd_ensure.txt || {
            cat > /tmp/cipd_ensure.txt <<'CIPD_EOF'
          gn/gn/linux-amd64 latest
          infra/ninja/linux-amd64 latest
          CIPD_EOF
            ./cipd ensure -root "$HOME/depot_tools" -ensure-file /tmp/cipd_ensure.txt
          }
          ./ensure_bootstrap
          which -a gn || true
          gn --version || true

      - name: Verify depot_tools in PATH
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"
          which -a gn || true
          which -a gclient || true
          which -a autoninja || true
          gn --version || true
          gclient --version || true

      - name: Run Chromium full build pipeline
        env:
          DEPOT_TOOLS_UPDATE: '0'
          GCLIENT_KILL_AFTER: '1800'

          AFTERBIRD_ARGS_VARIANT: ${{ github.event.inputs.args_variant }}
          AFTERBIRD_NINJA_JOBS: ${{ github.event.inputs.ninja_jobs }}
          AFTERBIRD_GCLIENT_NO_HISTORY: '1'
          AFTERBIRD_GCLIENT_EXTRA_ARGS: ${{ github.event.inputs.shallow_sync == 'true' && '--shallow' || '' }}
          AFTERBIRD_FORCE_WORKSPACE_CONFIG: '1'

          ENABLE_CCACHE: ${{ github.event.inputs.enable_ccache }}
          CCACHE_DIR: ${{ env.CCACHE_DIR }}
          CCACHE_BASEDIR: ${{ env.CCACHE_BASEDIR }}
          CCACHE_SLOPPINESS: ${{ env.CCACHE_SLOPPINESS }}
        run: |
          set -euo pipefail
          export PATH="$HOME/depot_tools:$PATH"

          echo "[workflow] gn:        $(which gn || echo MISSING)"
          echo "[workflow] gclient:   $(which gclient || echo MISSING)"
          echo "[workflow] autoninja: $(which autoninja || echo MISSING)"
          echo "[workflow] ccache:    $(which ccache || echo MISSING)"
          echo "[workflow] ENABLE_CCACHE=$ENABLE_CCACHE"
          echo "[workflow] AFTERBIRD_ARGS_VARIANT=$AFTERBIRD_ARGS_VARIANT"
          echo "[workflow] AFTERBIRD_NINJA_JOBS=$AFTERBIRD_NINJA_JOBS"
          echo "[workflow] AFTERBIRD_GCLIENT_EXTRA_ARGS=$AFTERBIRD_GCLIENT_EXTRA_ARGS"
          echo "[workflow] CCACHE_DIR=$CCACHE_DIR"
          echo "[workflow] CCACHE_BASEDIR=$CCACHE_BASEDIR"

          ci/chromium_android_pipeline.sh \
            --workdir "$RUNNER_TEMP/afterbird-chromium" \
            --out-dir "${{ github.event.inputs.out_dir }}" \
            --target "${{ github.event.inputs.target }}" \
            --full-build

      - name: ccache stats
        if: always() && github.event.inputs.enable_ccache == 'true'
        run: ccache -s || true
